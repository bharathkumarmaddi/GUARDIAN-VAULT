name: Release Guardian Vault

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Lint, Tests & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run TypeScript lint check
        run: npm run lint --if-present

      - name: Run Vitest security & transfer test suite
        run: npm test

      - name: Verify production web build
        run: npm run build

  desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run electron:build:win
          - os: macos-latest
            cmd: npm run electron:build:mac
          - os: ubuntu-latest
            cmd: npm run electron:build:linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build desktop installers
        run: ${{ matrix.cmd }}

      - name: Upload desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/Guardian-Vault-Windows-Setup.exe
            release/Guardian-Vault-Windows-Portable.exe
            release/Guardian-Vault-macOS.dmg
            release/Guardian-Vault-Linux.AppImage
            release/Guardian-Vault-Linux.deb

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle for Android
        run: VITE_TARGET=android npm run build

      - name: Sync or Add Capacitor Android platform & assemble APK
        run: |
          mkdir -p release-android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release-android/Guardian-Vault-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: release-android/Guardian-Vault-Android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [verify, desktop, android]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List collected release assets
        run: ls -lh release-assets/

      - name: Publish binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          name: Guardian Vault ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          files: release-assets/*
          make_latest: true
          draft: false
          generate_release_notes: true
